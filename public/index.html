<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div class="app">
    <p class="demo-note" data-usernode-demo-note hidden>Staging demo: made-up movies and friends</p>
    <h1>Movies Tier List</h1>
    <p class="sub" id="sub">One shared list.</p>
    <div id="add-block">
      <p class="empty-title" id="empty-title" hidden>No movies on the list yet</p>
      <label class="lbl" for="movie-title">Movie name</label>
      <form class="add" id="add-form" autocomplete="off">
        <input class="field" id="movie-title" name="title" maxlength="120" placeholder="e.g. Paddington 2" required>
        <button class="btn-primary" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      </form>
      <p class="write-msg" id="add-msg" role="status" hidden></p>
    </div>

    <div id="list-error" class="state-error" hidden>
      <p class="err-title">The tier list could not be loaded</p>
      <p class="err-body">Nothing on it was lost.</p>
      <button class="btn-secondary" id="retry" type="button">Retry</button>
    </div>

    <div id="list-area">
    <div class="tier tier-band" data-tier="S"><div class="lab" style="background:rgb(var(--tier-s))">S<small></small></div><div class="strip"><div class="holes sprockets"></div><div class="frames"><span class="skeleton h-11 w-32"></span><span class="skeleton h-11 w-24"></span><span class="skeleton h-11 w-28"></span></div><div class="holes sprockets"></div></div></div>

    <div class="tier tier-band" data-tier="A"><div class="lab" style="background:rgb(var(--tier-a))">A<small></small></div><div class="strip"><div class="holes sprockets"></div><div class="frames"><span class="skeleton h-11 w-24"></span><span class="skeleton h-11 w-32"></span></div><div class="holes sprockets"></div></div></div>

    <div class="tier tier-band" data-tier="B"><div class="lab" style="background:rgb(var(--tier-b))">B<small></small></div><div class="strip"><div class="holes sprockets"></div><div class="frames"><span class="skeleton h-11 w-32"></span><span class="skeleton h-11 w-24"></span></div><div class="holes sprockets"></div></div></div>

    <div class="tier tier-band" data-tier="C"><div class="lab" style="background:rgb(var(--tier-c))">C<small></small></div><div class="strip"><div class="holes sprockets"></div><div class="frames"><span class="skeleton h-11 w-28"></span><span class="skeleton h-11 w-24"></span></div><div class="holes sprockets"></div></div></div>

    <div class="tier tier-band" data-tier="D"><div class="lab" style="background:rgb(var(--tier-d))">D<small></small></div><div class="strip"><div class="holes sprockets"></div><div class="frames"><span class="skeleton h-11 w-24"></span><span class="skeleton h-11 w-32"></span></div><div class="holes sprockets"></div></div></div>

    <div class="pool" id="pool">
      <p class="section-label" id="waiting-label">Waiting to be sorted</p>
      <ul class="list" id="waiting-list">
        <li class="list-row"><span class="skeleton h-4 w-40"></span></li>
        <li class="list-row"><span class="skeleton h-4 w-48"></span></li>
      </ul>
    </div>
    </div>
    </div>
  </div>

  <!-- Screen 2, the movie panel, as the spec drew it, moved into the page as
       the bottom sheet it becomes. -->
  <div data-spec-screen="2" id="sheet-root" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="grab"></div>
      <div class="top"><div class="t"><h2 id="sheet-title"></h2><p class="who" id="sheet-who"></p></div><button class="x" id="sheet-close" type="button" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="section-label">Move to tier</p>
      <div class="tiers" id="sheet-tiers"><button class="tb" type="button" style="background:rgb(var(--tier-s))" data-move="S">S</button><button class="tb" type="button" style="background:rgb(var(--tier-a))" data-move="A">A</button><button class="tb" type="button" style="background:rgb(var(--tier-b))" data-move="B">B</button><button class="tb" type="button" style="background:rgb(var(--tier-c))" data-move="C">C</button><button class="tb" type="button" style="background:rgb(var(--tier-d))" data-move="D">D</button></div>
      <button class="btn-secondary" type="button" id="sheet-waiting"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Back to waiting</button>
      <p class="write-msg" id="sheet-msg" role="status" hidden></p>
      <div class="foot" id="sheet-foot"></div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->

  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1';
    var TIERS = ['S', 'A', 'B', 'C', 'D'];
    var movies = [];
    var viewerId = null;
    var loaded = false;
    var currentId = null;

    function $(id) { return document.getElementById(id); }
    var subEl = $('sub');
    var addBlock = $('add-block');
    var emptyTitle = $('empty-title');
    var addForm = $('add-form');
    var addBtn = addForm.querySelector('button[type="submit"]');
    var titleInput = $('movie-title');
    var addMsg = $('add-msg');
    var listArea = $('list-area');
    var listError = $('list-error');
    var retry = $('retry');
    var pool = $('pool');
    var waitingLabel = $('waiting-label');
    var waitingList = $('waiting-list');
    var sheetRoot = $('sheet-root');
    var sheet = $('sheet');
    var sheetTitle = $('sheet-title');
    var sheetWho = $('sheet-who');
    var sheetTiers = $('sheet-tiers');
    var sheetWaiting = $('sheet-waiting');
    var sheetMsg = $('sheet-msg');
    var sheetFoot = $('sheet-foot');

    var BIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
    var FLAG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';

    if (DEMO) {
      var note = document.querySelector('[data-usernode-demo-note]');
      if (note) note.hidden = false;
    }

    function api(path, options) {
      options = options || {};
      var url = path + (DEMO ? (path.indexOf('?') === -1 ? '?' : '&') + 'demo=1' : '');
      var headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      try {
        if (window.usernode && typeof window.usernode.now === 'function') {
          headers['x-usernode-now'] = window.usernode.now();
        }
      } catch (e) {}
      return fetch(url, {
        method: options.method || 'GET',
        headers: headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
        credentials: 'same-origin'
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok, status: res.status, data: data };
        });
      });
    }

    function skeletonFrames() {
      TIERS.forEach(function (t) {
        var band = document.querySelector('[data-tier="' + t + '"]');
        var frames = band.querySelector('.frames');
        frames.textContent = '';
        var widths = ['w-32', 'w-24', 'w-28'];
        for (var i = 0; i < (t === 'S' ? 3 : 2); i++) {
          var s = document.createElement('span');
          s.className = 'skeleton h-11 ' + widths[i % widths.length];
          frames.appendChild(s);
        }
        band.querySelector('.lab small').textContent = '';
      });
      waitingList.textContent = '';
      ['w-40', 'w-48'].forEach(function (w) {
        var li = document.createElement('li');
        li.className = 'list-row';
        var s = document.createElement('span');
        s.className = 'skeleton h-4 ' + w;
        li.appendChild(s);
        waitingList.appendChild(li);
      });
      waitingLabel.textContent = 'Waiting to be sorted';
    }

    function setState(state) {
      listError.hidden = state !== 'error';
      listArea.hidden = state === 'error';
      addBlock.hidden = state === 'error';
      if (state !== 'ready') {
        pool.hidden = true;
        addBlock.classList.remove('note');
        emptyTitle.hidden = true;
        subEl.textContent = 'One shared list.';
      }
      if (state === 'loading') skeletonFrames();
    }

    function findMovie(id) {
      for (var i = 0; i < movies.length; i++) {
        if (String(movies[i].id) === String(id)) return movies[i];
      }
      return null;
    }

    function render() {
      var total = movies.length;
      subEl.textContent = total === 0 ? 'One shared list.' :
        'One shared list. ' + total + (total === 1 ? ' movie, sorted by all of you.' : ' movies, sorted by all of you.');

      TIERS.forEach(function (t) {
        var band = document.querySelector('[data-tier="' + t + '"]');
        var frames = band.querySelector('.frames');
        frames.textContent = '';
        var inTier = movies.filter(function (m) { return m.tier === t; });
        band.querySelector('.lab small').textContent = String(inTier.length);
        if (!inTier.length) {
          var e = document.createElement('span');
          e.className = 'empty';
          e.textContent = 'Nothing here yet';
          frames.appendChild(e);
        } else {
          inTier.forEach(function (m) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'chip movie-chip';
            b.textContent = m.title;
            b.addEventListener('click', function () { openSheet(m.id); });
            frames.appendChild(b);
          });
        }
      });

      var waiting = movies.filter(function (m) { return m.tier === null; });
      waitingLabel.textContent = 'Waiting to be sorted (' + waiting.length + ')';
      waitingList.textContent = '';
      waiting.forEach(function (m) {
        var li = document.createElement('li');
        li.className = 'list-row';
        var t = document.createElement('span');
        t.className = 't';
        t.textContent = m.title;
        var who = document.createElement('span');
        who.className = 'who';
        who.textContent = m.isMine ? 'Added by you' : 'Added by ' + m.addedByName;
        t.appendChild(who);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-secondary';
        btn.textContent = 'Pick tier';
        btn.addEventListener('click', function () { openSheet(m.id); });
        li.appendChild(t);
        li.appendChild(btn);
        waitingList.appendChild(li);
      });
      pool.hidden = total === 0 || waiting.length === 0;

      var empty = loaded && total === 0;
      addBlock.classList.toggle('note', empty);
      emptyTitle.hidden = !empty;
    }

    function load() {
      return api('/api/movies').then(function (r) {
        if (!r.ok) throw new Error('load');
        movies = r.data.movies || [];
        viewerId = r.data.viewerId == null ? null : String(r.data.viewerId);
        loaded = true;
        setState('ready');
        render();
      }).catch(function () {
        setState('error');
      });
    }

    function showMsg(el, text) {
      el.textContent = text;
      el.hidden = false;
    }
    function hideMsg(el) {
      el.textContent = '';
      el.hidden = true;
    }

    addForm.addEventListener('submit', function (event) {
      event.preventDefault();
      var title = titleInput.value.trim();
      if (!title) { titleInput.focus(); return; }
      hideMsg(addMsg);
      addBtn.disabled = true;
      api('/api/movies', { method: 'POST', body: { title: title } }).then(function (r) {
        if (r.ok) {
          titleInput.value = '';
          return load();
        }
        if (r.status === 409) {
          var where = r.data.tier ? 'in ' + r.data.tier : 'in Waiting to be sorted';
          showMsg(addMsg, '"' + title + '" is already on the list, ' + where + '.');
        } else if (r.status === 401) {
          showMsg(addMsg, 'Make an account to add movies.');
        } else {
          showMsg(addMsg, 'Could not add the movie. It was not added. Try again.');
        }
      }).catch(function () {
        showMsg(addMsg, 'Could not add the movie. It was not added. Try again.');
      }).finally(function () {
        addBtn.disabled = false;
      });
    });

    function renderFoot(m) {
      sheetFoot.textContent = '';
      if (m.isMine) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'quiet del';
        del.innerHTML = BIN + 'Remove movie';
        del.addEventListener('click', function () { armRemove(m); });
        sheetFoot.appendChild(del);
      } else {
        var rep = document.createElement('button');
        rep.type = 'button';
        rep.className = 'quiet';
        rep.innerHTML = FLAG + (m.reported ? 'Reported' : 'Report');
        rep.disabled = !!m.reported;
        rep.addEventListener('click', function () { report(m); });
        sheetFoot.appendChild(rep);
      }
    }

    function openSheet(id) {
      var m = findMovie(id);
      if (!m) return;
      currentId = id;
      sheetRoot.hidden = false;
      document.body.classList.add('sheet-open');
      sheetTitle.textContent = m.title;
      var who = m.isMine ? 'Added by you.' : 'Added by ' + m.addedByName + '.';
      if (m.tier) {
        who += ' Now in ' + m.tier + (m.movedByName ? ', moved there by ' + m.movedByName + '.' : '.');
      } else {
        who += ' Waiting to be sorted' + (m.movedByName ? ', moved back by ' + m.movedByName + '.' : '.');
      }
      sheetWho.textContent = who;
      TIERS.forEach(function (t) {
        var b = sheetTiers.querySelector('[data-move="' + t + '"]');
        var current = m.tier === t;
        b.classList.toggle('on', current);
        b.setAttribute('aria-pressed', current ? 'true' : 'false');
        b.disabled = false;
        b.onclick = function () {
          if (m.tier !== t) moveTo(id, t);
          else setSheetStatus('');
        };
      });
      sheetWaiting.disabled = m.tier === null;
      sheetWaiting.onclick = function () { if (m.tier !== null) moveTo(id, null); };
      renderFoot(m);
      hideMsg(sheetMsg);
      try { sheet.focus({ preventScroll: true }); } catch (e) { sheet.focus(); }
    }

    function closeSheet() {
      sheetRoot.hidden = true;
      document.body.classList.remove('sheet-open');
      currentId = null;
    }

    function setSheetStatus(text) {
      if (text) showMsg(sheetMsg, text);
      else hideMsg(sheetMsg);
    }

    function moveTo(id, tier) {
      var m = findMovie(id);
      if (!m) return;
      setSheetStatus('');
      Array.prototype.forEach.call(sheetTiers.querySelectorAll('button'), function (b) { b.disabled = true; });
      sheetWaiting.disabled = true;
      api('/api/movies/' + id, { method: 'PATCH', body: { tier: tier } }).then(function (r) {
        if (r.ok) {
          return load().then(function () {
            if (findMovie(id)) openSheet(id);
            else closeSheet();
          });
        }
        openSheet(id);
        if (r.status === 401) setSheetStatus('Make an account to move movies.');
        else if (r.status === 404) setSheetStatus('That movie is no longer on the list.');
        else {
          var where = m.tier ? 'in ' + m.tier : 'in Waiting to be sorted';
          setSheetStatus('Could not move it. It is still ' + where + '.');
        }
      }).catch(function () {
        openSheet(id);
        setSheetStatus('Could not move it. It is still where it was.');
      });
    }

    function armRemove(m) {
      sheetFoot.textContent = '';
      var ask = document.createElement('span');
      ask.className = 'confirm';
      ask.textContent = 'Remove this movie?';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'quiet';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', function () { renderFoot(m); });
      var yes = document.createElement('button');
      yes.type = 'button';
      yes.className = 'quiet del';
      yes.textContent = 'Remove';
      yes.addEventListener('click', function () { doRemove(m); });
      sheetFoot.appendChild(ask);
      sheetFoot.appendChild(cancel);
      sheetFoot.appendChild(yes);
    }

    function doRemove(m) {
      api('/api/movies/' + m.id, { method: 'DELETE' }).then(function (r) {
        if (r.ok) {
          closeSheet();
          return load();
        }
        if (r.status === 401) setSheetStatus('Make an account to remove movies.');
        else if (r.status === 403) setSheetStatus('Only the person who added a movie can remove it.');
        else setSheetStatus('Could not remove the movie. It is still on the list.');
      }).catch(function () {
        setSheetStatus('Could not remove the movie. It is still on the list.');
      });
    }

    function report(m) {
      api('/api/movies/' + m.id + '/report', { method: 'POST' }).then(function (r) {
        if (r.ok) {
          m.reported = true;
          renderFoot(m);
          setSheetStatus('');
        } else if (r.status === 401) {
          setSheetStatus('Make an account to report a movie.');
        } else {
          setSheetStatus('Could not report the movie. Try again.');
        }
      }).catch(function () {
        setSheetStatus('Could not report the movie. Try again.');
      });
    }

    $('sheet-close').addEventListener('click', closeSheet);
    $('scrim').addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !sheetRoot.hidden) closeSheet();
    });
    retry.addEventListener('click', function () {
      setState('loading');
      load();
    });

    load();
  })();
  </script>
</body>
</html>
