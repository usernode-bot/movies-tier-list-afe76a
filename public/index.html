<!DOCTYPE html>
<html lang="en">
<head>

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Movies Tier List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div class="app">
    <h1>Movies Tier List</h1>
    <p class="sub">One shared list. 17 movies, sorted by all of you.</p>
    <label class="lbl">Movie name</label>
    <div class="add"><input class="field" placeholder="e.g. Paddington 2"><button class="btn-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>

    <div class="tier"><div class="lab" style="background:rgb(var(--tier-s))">S<small>4</small></div><div class="strip"><div class="holes"></div><div class="frames"><button class="chip">Spirited Away</button><button class="chip">Parasite</button><button class="chip">The Godfather</button><button class="chip">Paddington 2</button></div><div class="holes"></div></div></div>

    <div class="tier"><div class="lab" style="background:rgb(var(--tier-a))">A<small>5</small></div><div class="strip"><div class="holes"></div><div class="frames"><button class="chip">Inception</button><button class="chip">Mad Max: Fury Road</button><button class="chip">Knives Out</button><button class="chip">Coco</button><button class="chip">Heat</button></div><div class="holes"></div></div></div>

    <div class="tier"><div class="lab" style="background:rgb(var(--tier-b))">B<small>3</small></div><div class="strip"><div class="holes"></div><div class="frames"><button class="chip">Top Gun: Maverick</button><button class="chip">The Martian</button><button class="chip">Barbie</button></div><div class="holes"></div></div></div>

    <div class="tier"><div class="lab" style="background:rgb(var(--tier-c))">C<small>2</small></div><div class="strip"><div class="holes"></div><div class="frames"><button class="chip">Jurassic World</button><button class="chip">Cats</button></div><div class="holes"></div></div></div>

    <div class="tier"><div class="lab" style="background:rgb(var(--tier-d))">D<small>0</small></div><div class="strip"><div class="holes"></div><div class="frames"><span class="empty">Nothing here yet</span></div><div class="holes"></div></div></div>

    <div class="pool"><p class="section-label">Waiting to be sorted (3)</p>
    <ul class="list">
    <li class="list-row"><span class="t">Dune: Part Two<span class="who">Added by you</span></span><button class="btn-secondary">Pick tier</button></li>
    <li class="list-row"><span class="t">The Holdovers<span class="who">Added by Maya</span></span><button class="btn-secondary">Pick tier</button></li>
    <li class="list-row"><span class="t">Everything Everywhere All at Once<span class="who">Added by Theo</span></span><button class="btn-secondary">Pick tier</button></li>
    </ul></div>
    </div>
  </div>
  <!-- Screen 2 as the spec drew it: inert until moved where that view belongs. -->
  <template data-spec-screen="2">
    <div data-spec-screen="2">
      <div class="app">
      <div class="behind"><h1>Movies Tier List</h1><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>
      <div class="scrim"></div>
      <div class="sheet">
      <div class="grab"></div>
      <div class="top"><div class="t"><h2>Paddington 2</h2><p class="who">Added by you. Now in S, moved there by Maya.</p></div><button class="x" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="section-label">Move to tier</p>
      <div class="tiers"><button class="tb on" style="background:rgb(var(--tier-s))" aria-pressed="true">S</button><button class="tb" style="background:rgb(var(--tier-a))">A</button><button class="tb" style="background:rgb(var(--tier-b))">B</button><button class="tb" style="background:rgb(var(--tier-c))">C</button><button class="tb" style="background:rgb(var(--tier-d))">D</button></div>
      <button class="btn-secondary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Back to waiting</button>
      <div class="foot"><button class="quiet del"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove movie</button></div>
      </div>
      </div>
    </div>
  </template>
  <!-- /usernode-spec-screens@1 -->
</body>
</html>
